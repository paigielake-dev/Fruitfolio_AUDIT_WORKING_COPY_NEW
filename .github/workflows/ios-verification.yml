name: Fruitfolio iOS verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  group: fruitfolio-ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Capture Apple tool versions
        id: apple-tools
        run: |
          mkdir -p Fruitfolio_Verification_Evidence/Build
          xcodebuild -version | tee Fruitfolio_Verification_Evidence/Build/xcode-version.txt
          swift --version | tee Fruitfolio_Verification_Evidence/Build/swift-version.txt
          xcrun simctl list devices available > Fruitfolio_Verification_Evidence/Build/simulators.txt
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: Vendor/llama.xcframework
          key: llama-ios-v1-${{ runner.arch }}-${{ steps.apple-tools.outputs.xcode }}-${{ hashFiles('llama.cpp/**', 'Tools/build_ios_llama.sh') }}
      - name: Build vendored iOS runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash Tools/build_ios_llama.sh 2>&1 | tee Fruitfolio_Verification_Evidence/Build/apple-runtime-build.log
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: Vendor/llama.xcframework
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Preserve built Apple runtime before app tests
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Apple_Runtime
          path: |
            Vendor/llama.xcframework
            Fruitfolio_Verification_Evidence/Build/apple-runtime-build.log
            Fruitfolio_Verification_Evidence/Build/xcode-version.txt
            Fruitfolio_Verification_Evidence/Build/swift-version.txt
      - uses: actions/cache@v4
        id: madlad-runtime-cache
        with:
          path: Vendor/FruitfolioMADLAD.xcframework
          key: madlad-runtime-${{ runner.arch }}-${{ steps.apple-tools.outputs.xcode }}-${{ hashFiles('TranslationInvestigation/madlad-candle-probe/src/lib.rs', 'TranslationInvestigation/madlad-candle-probe/Cargo.lock', 'TranslationInvestigation/madlad-candle-probe/include/**', 'Tools/build_ios_madlad.sh', 'Tools/prepare_candle_madlad.py') }}
      - name: Build linked MADLAD Apple runtime
        if: steps.madlad-runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash Tools/build_ios_madlad.sh 2>&1 | tee Fruitfolio_Verification_Evidence/Build/madlad-runtime-build.log
      - uses: actions/cache@v4
        with:
          path: Models/MADLAD
          key: madlad-official-resources-ea6e5531a3e95213-v1
      - name: Acquire and verify approved translation resources
        run: python3 Tools/prepare_madlad_resources.py
      - name: Choose installed iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/fruitfolio-devices.json
          python3 - <<'PY'
          import json,os
          devices=json.load(open('/tmp/fruitfolio-devices.json'))['devices']
          iphones=[d for key, group in devices.items() if 'iOS' in key for d in group if d.get('isAvailable') and 'iPhone' in d['name']]
          if not iphones: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('FRUITFOLIO_SIMULATOR_ID='+iphones[0]['udid']+'\n')
          PY
      - name: Build application and test targets
        id: app-build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/Build.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-build.log
      - name: Reject obsolete dynamic runtime autolink
        run: |
          app=.ciDerivedData/Build/Products/Debug-iphonesimulator/Fruitfolio.app
          for binary in "$app/Fruitfolio" "$app/Fruitfolio.debug.dylib"; do
            if [ -f "$binary" ]; then
              otool -L "$binary" >> Fruitfolio_Verification_Evidence/Build/linked-libraries.txt
            fi
          done
          python3 - <<'PYCODE'
          from pathlib import Path
          text=Path('Fruitfolio_Verification_Evidence/Build/linked-libraries.txt').read_text()
          if '@rpath/llama.framework/llama' in text:
              raise SystemExit('Obsolete dynamic llama framework is still autolinked')
          PYCODE
      - name: Run unit and native inference tests
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData -only-testing:FruitfolioTests \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-unit-test.log
      - name: Preserve unit and build results before UI tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Unit_Build_Evidence
          path: |
            Fruitfolio_Verification_Evidence/Build
      - name: Simulator smoke test and representative recording
        id: smoke
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        run: |
          set -o pipefail
          # Reboot after native tests before attaching XCTest UI automation.
          xcrun simctl shutdown "$FRUITFOLIO_SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl boot "$FRUITFOLIO_SIMULATOR_ID"
          xcrun simctl bootstatus "$FRUITFOLIO_SIMULATOR_ID" -b
          python3 Tools/record_simulator_clip.py --udid "$FRUITFOLIO_SIMULATOR_ID" \
            --seconds 60 --output Fruitfolio_Verification_Evidence/Animations/SimulatorSmoke.mp4 \
            > Fruitfolio_Verification_Evidence/Build/simulator-recording.log 2>&1 &
          recorder=$!
          set +e
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData \
            -only-testing:FruitfolioUITests/SimulatorSmokeEvidenceTests \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/Smoke.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-smoke-test.log
          test_status=${PIPESTATUS[0]}
          wait "$recorder"
          record_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          exit "$record_status"
      - name: Export smoke screenshot attachments
        if: always()
        run: |
          if [ -d Fruitfolio_Verification_Evidence/Build/Smoke.xcresult ]; then
            mkdir -p Fruitfolio_Verification_Evidence/Visual/Smoke
            xcrun xcresulttool export attachments \
              --path Fruitfolio_Verification_Evidence/Build/Smoke.xcresult \
              --output-path Fruitfolio_Verification_Evidence/Visual/Smoke
          fi
      - name: Preserve early simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Smoke_Evidence
          path: Fruitfolio_Verification_Evidence
      - name: Verify shared controls in actual Contact journeys
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData -parallel-testing-enabled NO \
            -only-testing:FruitfolioUITests/SharedControlUITests \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/SharedControls.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-shared-controls-ui.log
      - name: Export and preserve shared-control evidence
        if: always()
        run: |
          if [ -f Fruitfolio_Verification_Evidence/Build/SharedControls.xcresult/Info.plist ]; then
            mkdir -p Fruitfolio_Verification_Evidence/Visual/SharedControls
            xcrun xcresulttool export attachments \
              --path Fruitfolio_Verification_Evidence/Build/SharedControls.xcresult \
              --output-path Fruitfolio_Verification_Evidence/Visual/SharedControls
          fi
      - name: Preserve focused shared-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Shared_Control_Evidence
          path: |
            Fruitfolio_Verification_Evidence/Build/xcode-shared-controls-ui.log
            Fruitfolio_Verification_Evidence/Build/SharedControls.xcresult
            Fruitfolio_Verification_Evidence/Visual/SharedControls
      - name: Verify hormone record lifecycle before broad traversal
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData -parallel-testing-enabled NO \
            -only-testing:FruitfolioUITests/HormoneMeasurementUITests \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/Hormone.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-hormone-ui-test.log
      - name: Export and preserve hormone lifecycle evidence
        if: always()
        run: |
          if [ -d Fruitfolio_Verification_Evidence/Build/Hormone.xcresult ]; then
            mkdir -p Fruitfolio_Verification_Evidence/Visual/HormoneInformation
            xcrun xcresulttool export attachments \
              --path Fruitfolio_Verification_Evidence/Build/Hormone.xcresult \
              --output-path Fruitfolio_Verification_Evidence/Visual/HormoneInformation
          fi
      - name: Preserve focused functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Hormone_Functional_Evidence
          path: Fruitfolio_Verification_Evidence
      - name: Verify user-authored page lifecycle before broad traversal
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData -parallel-testing-enabled NO \
            -only-testing:FruitfolioUITests/UserAuthoredPageUITests \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/UserPages.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-user-pages-ui-test.log
      - name: Export and preserve user-page lifecycle evidence
        if: always()
        run: |
          if [ -d Fruitfolio_Verification_Evidence/Build/UserPages.xcresult ]; then
            mkdir -p Fruitfolio_Verification_Evidence/Visual/UserPages
            xcrun xcresulttool export attachments \
              --path Fruitfolio_Verification_Evidence/Build/UserPages.xcresult \
              --output-path Fruitfolio_Verification_Evidence/Visual/UserPages
          fi
      - name: Preserve focused user-page evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_User_Page_Evidence
          path: |
            Fruitfolio_Verification_Evidence/Build/xcode-user-pages-ui-test.log
            Fruitfolio_Verification_Evidence/Build/UserPages.xcresult
            Fruitfolio_Verification_Evidence/Visual/UserPages
      - name: Verify artwork volume settings and restart persistence before broad traversal
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData -parallel-testing-enabled NO \
            -only-testing:FruitfolioUITests/SettingsVolumeUITests \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/SettingsVolumes.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-settings-volumes-ui-test.log
      - name: Export and preserve volume lifecycle evidence
        if: always()
        run: |
          if [ -d Fruitfolio_Verification_Evidence/Build/SettingsVolumes.xcresult ]; then
            mkdir -p Fruitfolio_Verification_Evidence/Visual/SettingsVolumes
            xcrun xcresulttool export attachments \
              --path Fruitfolio_Verification_Evidence/Build/SettingsVolumes.xcresult \
              --output-path Fruitfolio_Verification_Evidence/Visual/SettingsVolumes
          fi
      - name: Preserve focused volume evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Settings_Volume_Evidence
          path: |
            Fruitfolio_Verification_Evidence/Build/xcode-settings-volumes-ui-test.log
            Fruitfolio_Verification_Evidence/Build/SettingsVolumes.xcresult
            Fruitfolio_Verification_Evidence/Visual/SettingsVolumes
      - name: Verify grounded Ask answer and clear-on-exit lifecycle before broad traversal
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData -parallel-testing-enabled NO \
            -only-testing:FruitfolioUITests/AskGroundedJourneyUITests \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/AskJourney.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-ask-journey-ui-test.log
      - name: Export and preserve Ask lifecycle evidence
        if: always()
        run: |
          if [ -d Fruitfolio_Verification_Evidence/Build/AskJourney.xcresult ]; then
            mkdir -p Fruitfolio_Verification_Evidence/Visual/AskJourney
            xcrun xcresulttool export attachments \
              --path Fruitfolio_Verification_Evidence/Build/AskJourney.xcresult \
              --output-path Fruitfolio_Verification_Evidence/Visual/AskJourney
          fi
      - name: Preserve focused Ask evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Ask_Journey_Evidence
          path: |
            Fruitfolio_Verification_Evidence/Build/xcode-ask-journey-ui-test.log
            Fruitfolio_Verification_Evidence/Build/AskJourney.xcresult
            Fruitfolio_Verification_Evidence/Visual/AskJourney
      - name: Run actual application UI tests
        timeout-minutes: 60
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData -parallel-testing-enabled NO -only-testing:FruitfolioUITests \
            -skip-testing:FruitfolioUITests/SettingsVolumeUITests \
            -skip-testing:FruitfolioUITests/AskGroundedJourneyUITests \
            -skip-testing:FruitfolioUITests/UserAuthoredPageUITests \
            -skip-testing:FruitfolioUITests/SharedControlUITests \
            -skip-testing:FruitfolioUITests/HormoneMeasurementUITests \
            -skip-testing:FruitfolioUITests/SimulatorSmokeEvidenceTests \
            -skip-testing:FruitfolioUITests/FruitfolioUITests/testFruitfolioCompleteDeepAudit \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/Fruitfolio.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-ui-test.log
      - name: Export actual XCTest screenshot attachments
        if: always()
        run: |
          if [ -d Fruitfolio_Verification_Evidence/Build/Fruitfolio.xcresult ]; then
            mkdir -p Fruitfolio_Verification_Evidence/Visual
            xcrun xcresulttool export attachments \
              --path Fruitfolio_Verification_Evidence/Build/Fruitfolio.xcresult \
              --output-path Fruitfolio_Verification_Evidence/Visual
          fi
      - name: Bounded exploratory visual traversal after functional tests
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Fruitfolio.xcodeproj -scheme Fruitfolio \
            -destination "platform=iOS Simulator,id=$FRUITFOLIO_SIMULATOR_ID" \
            -derivedDataPath .ciDerivedData -parallel-testing-enabled NO \
            -only-testing:FruitfolioUITests/FruitfolioUITests/testFruitfolioCompleteDeepAudit \
            -resultBundlePath Fruitfolio_Verification_Evidence/Build/Exploratory.xcresult \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee Fruitfolio_Verification_Evidence/Build/xcode-exploratory-test.log
      - name: Export exploratory attachments if finalized
        if: always()
        run: |
          if [ -f Fruitfolio_Verification_Evidence/Build/Exploratory.xcresult/Info.plist ]; then
            mkdir -p Fruitfolio_Verification_Evidence/Visual/Exploratory
            xcrun xcresulttool export attachments \
              --path Fruitfolio_Verification_Evidence/Build/Exploratory.xcresult \
              --output-path Fruitfolio_Verification_Evidence/Visual/Exploratory
          fi
      - name: Package all actual evidence into downloadable parts
        if: always()
        run: python3 Tools/package_verification_evidence.py
      - name: Preserve evidence part index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Parts_Index
          path: VerificationDownloads/EvidenceParts.json
      - name: Preserve evidence part 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Part_01
          path: VerificationDownloads/Fruitfolio_Verification_Evidence.zip.part01
          if-no-files-found: ignore
          compression-level: 0
      - name: Preserve evidence part 02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Part_02
          path: VerificationDownloads/Fruitfolio_Verification_Evidence.zip.part02
          if-no-files-found: ignore
          compression-level: 0
      - name: Preserve evidence part 03
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Part_03
          path: VerificationDownloads/Fruitfolio_Verification_Evidence.zip.part03
          if-no-files-found: ignore
          compression-level: 0
      - name: Preserve evidence part 04
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Part_04
          path: VerificationDownloads/Fruitfolio_Verification_Evidence.zip.part04
          if-no-files-found: ignore
          compression-level: 0
      - name: Preserve evidence part 05
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Part_05
          path: VerificationDownloads/Fruitfolio_Verification_Evidence.zip.part05
          if-no-files-found: ignore
          compression-level: 0
      - name: Preserve evidence part 06
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Part_06
          path: VerificationDownloads/Fruitfolio_Verification_Evidence.zip.part06
          if-no-files-found: ignore
          compression-level: 0
      - name: Preserve evidence part 07
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Part_07
          path: VerificationDownloads/Fruitfolio_Verification_Evidence.zip.part07
          if-no-files-found: ignore
          compression-level: 0
      - name: Preserve evidence part 08
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fruitfolio_Evidence_Part_08
          path: VerificationDownloads/Fruitfolio_Verification_Evidence.zip.part08
          if-no-files-found: ignore
          compression-level: 0
